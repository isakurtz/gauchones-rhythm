name: Deploy to GitHub Pages

# O repo era um index.html solto servido direto pelo Pages. Agora é um app
# Next.js exportado estático, então o Pages passa a ser publicado por Actions
# (Settings -> Pages -> Source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; não cancela a que já está rodando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # o site vive sob /gauchones-rhythm/ no github.io — vale pro basePath
          # do Next e pro fetch() das músicas (ver next.config.ts)
          NEXT_PUBLIC_BASE_PATH: /gauchones-rhythm
      # sem isso o Pages roda Jekyll e ignora arquivos/pastas com _
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
